name: Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-github-smoke:
    name: Live GitHub API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install extension from checkout
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-config
        run: |
          gh extension install .
          gh contrib-doctor --version
          gh contrib-doctor --help >/dev/null

      - name: Exercise live repository API
        shell: bash
        run: |
          repo_json=$(gh repo view "$GITHUB_REPOSITORY" --json nameWithOwner,defaultBranchRef,isFork,visibility,viewerPermission)
          printf '%s\n' "$repo_json"

          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name + " default=" + .default_branch'

          default_branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')
          [ -n "$default_branch" ]
          default_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$default_branch" --jq '.commit.sha')
          [ -n "$default_sha" ]
          git cat-file -e "$default_sha^{commit}"

      - name: Explain full diagnostic auth requirement
        run: |
          echo "The full doctor requires a user-authenticated GitHub CLI session."
          echo "GitHub Actions' repository-scoped GITHUB_TOKEN cannot access the /user endpoint,"
          echo "so CI validates installation plus the live repository APIs used by the doctor."
